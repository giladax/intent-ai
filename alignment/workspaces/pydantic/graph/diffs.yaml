- diff_id: GD-3
  question: These 8 promises, 4 code locations and 1 document describe one thing —
    call it Union Validation?
  proposed_by: llm
  evidence:
  - quote: The default union validation mode in Pydantic >=2 is smart mode (`union_mode='smart'`),
      not left-to-right mode.
    source: PYDANT-031 · unions Left to Right Mode
  - quote: In left-to-right mode, validation is attempted against each union member
      in definition order and the first successful validation is accepted as the result.
    source: PYDANT-030 · unions Left to Right Mode
  - quote: In smart mode for non-model types, if an exact type match is found, that
      member is returned immediately and subsequent members are not attempted.
    source: PYDANT-033 · unions Smart Mode
  - quote: In smart mode, for models/dataclasses/TypedDicts, the valid-fields-set
      count takes priority over exactness score when selecting the best match.
