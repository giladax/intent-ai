- diff_id: GD-2
  question: These 4 promises and 9 code locations describe one thing — call it Polymorphic
    Serialization?
  proposed_by: llm
  evidence:
  - quote: Polymorphic serialization must only be supported for Pydantic models and
      Pydantic dataclasses; standard library dataclasses must not support polymorphic
      serialization even if they are subclasses of a Pydantic dataclass.
    source: PYDANT-025 · serialization Polymorphic serialization
  - quote: When `polymorphic_serialization=True` is passed at runtime to a serialization
      method, the system may serialize a model instance according to the actual runtime
      subclass schema, overriding any per-class configuration.
    source: PYDANT-026 · serialization Polymorphic serialization
  - quote: When serializing a subclass instance assigned to a field annotated with
      a base model-like type, the system must serialize only the fields declared on
      the annotation type, not the subclass fields, by default.
    source: PYDANT-018 · serialization Subclasses of model-like types
  - quote: Subclasses of supported types must be serialized according to their superclass
      serialization schema.
    source: PYDANT-019 · serialization Subclasses of supported types
