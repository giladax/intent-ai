  question: These 4 promises, 6 code locations and 2 documents describe one thing
    — call it Discriminated Unions?
  proposed_by: llm
  evidence:
  - quote: Discriminated unions produce validation errors only for the union member
      with a matching discriminator value, not for all members.
    source: PYDANT-038 · unions Union Validation Errors
  - quote: When a discriminated union is defined, the generated JSON schema implements
      the `discriminator` attribute from the OpenAPI specification.
    source: PYDANT-039 · unions Discriminated unions
  - quote: When a callable discriminator returns `None`, a `union_tag_not_found` error
      is raised.
    source: PYDANT-037 · unions Discriminated Unions with callable Discriminator
  - quote: A `Discriminator` may accept `custom_error_type`, `custom_error_message`,
      and `custom_error_context` parameters to customize the error raised on validation
      failure.
