<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Situation — __WORKSPACE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Spline+Sans+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EFE5CE;--bone:#F5F1E8;--card:#FAF4E4;--ink:#1C1A15;
--line:rgba(28,26,21,.14);--dim:rgba(28,26,21,.62);--faint:rgba(28,26,21,.4);
--ok:#2E6B58;--warn:#B4681E;--bad:#D8492B;--ungov:#2B49D8;--accent:#2B49D8;
--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{font-family:'Hanken Grotesk',sans-serif;color:var(--ink);font-size:14px;min-height:100vh;background:var(--paper)}
::selection{background:var(--ink);color:var(--paper)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.99);filter:blur(8px)}
to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.rise{animation:rise .7s var(--ease) both}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.28);opacity:1}}
@keyframes needpulse{0%,100%{box-shadow:0 0 0 0 rgba(180,104,30,.5)}55%{box-shadow:0 0 0 7px rgba(180,104,30,0)}}
.masthead{display:flex;align-items:baseline;gap:20px;padding:26px 34px 16px;border-bottom:3px double var(--ink)}
.masthead h1{font-weight:800;font-size:24px;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:9px}
.masthead h1 em{font-style:normal}
.masthead h1::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--ok);animation:breathe 5.4s ease-in-out infinite}
.meta{color:var(--dim);font-size:12px;font-family:'Spline Sans Mono',monospace}
.nav{margin-left:auto;display:flex;gap:14px;font-size:12px}
.nav a{color:var(--dim);text-decoration:none;border-bottom:1px dashed var(--faint);cursor:pointer;transition:color .3s var(--ease)}
.nav a:hover{color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:26px 34px 70px}
h2{font-family:'Spline Sans Mono',monospace;font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:30px 0 10px;display:flex;align-items:center;gap:9px}
h2 .needdot{width:8px;height:8px;border-radius:50%;background:var(--warn);animation:needpulse 5.4s ease-in-out infinite}
.hero{border:1.5px solid var(--ink);border-radius:16px;background:var(--card);padding:20px 24px;margin-top:4px;box-shadow:5px 5px 0 0 #E7DDC4}
.hero.red{box-shadow:5px 5px 0 0 rgba(216,73,43,.4)}
.hero.ok{box-shadow:5px 5px 0 0 rgba(46,107,88,.4)}
.hero .head{font-weight:800;font-size:clamp(24px,3vw,34px);letter-spacing:-.025em;line-height:1.15;margin-bottom:8px}
.hero.red .head{color:var(--bad)}
.hero.ok .head{color:var(--ok)}
.flag{padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
.flag:first-of-type{border-top:none}
.flag b{font-weight:600}
.flag .where{color:var(--faint);font-size:11.5px;font-family:'Spline Sans Mono',monospace;margin-top:2px}
.h-CONTRADICTED{color:var(--bad);font-weight:700}
.h-partial{color:var(--warn);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.area{border:1px solid var(--line);border-radius:14px;background:var(--bone);padding:14px 16px;cursor:pointer;transition:transform .35s var(--ease),border-color .35s var(--ease);position:relative}
.area:hover{transform:translateY(-2px);border-color:var(--ink)}
.area::after{content:'↗';position:absolute;top:11px;right:14px;font-size:13px;color:var(--faint);transition:transform .35s var(--ease)}
.area:hover::after{transform:translate(3px,-3px);color:var(--ink)}
.area .label{font-weight:700;font-size:15.5px;letter-spacing:-.01em;margin-bottom:6px}
.area .counts{font-size:11.5px;color:var(--dim);line-height:1.8;font-family:'Spline Sans Mono',monospace}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)} .d-none{background:var(--faint)}
.inbox{border:1px solid var(--line);border-radius:14px;background:var(--bone);padding:14px 18px}
.inbox .item{padding:7px 0;font-size:13px;color:var(--dim);border-top:1px dashed var(--line)}
.inbox .item:first-of-type{border-top:none}
.inbox .item b{color:var(--ink);font-weight:600}
.coverage{color:var(--dim);font-size:14px;font-style:italic;border-left:3px solid var(--ink);padding:8px 16px;margin-top:18px;line-height:1.6}
.checks{font-size:12px;color:var(--dim);line-height:2;font-family:'Spline Sans Mono',monospace}
.empty{color:var(--faint);font-style:italic}
footer{padding:12px 34px;color:var(--faint);font-size:11px;border-top:3px double var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="masthead rise">
  <h1>Situation<em>·</em>Mirror</h1>
  <div class="meta" id="meta">loading…</div>
  <div class="nav">
    <a id="ledgerLink">timeline ledger →</a>
    <a href="/onboard">onboard another repo →</a>
  </div>
</div>
<main>
  <div class="hero rise" style="animation-delay:.1s" id="hero"><div class="head">loading the situation…</div></div>

  <h2 class="rise" style="animation-delay:.2s">Product areas</h2>
  <div class="grid rise" style="animation-delay:.26s" id="areas"></div>

  <h2 class="rise" style="animation-delay:.34s" id="waitingHead">Waiting on a human</h2>
  <div class="inbox rise" style="animation-delay:.4s" id="inbox"></div>

  <div class="coverage rise" style="animation-delay:.48s" id="coverage"></div>

  <h2 class="rise" style="animation-delay:.54s">Recent checks</h2>
  <div class="checks rise" style="animation-delay:.6s" id="checks"></div>
</main>
<footer>every claim traces to a commit, a contract version, and your own documents · the mirror shows deltas, not dashboards</footer>
<script>
const WS = "__WORKSPACE__";
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

async function load(){
  let d;
  try{
    const r = await fetch(`/api/mirror/${WS}`);
    if(!r.ok) throw new Error(await r.text());
    d = await r.json();
  }catch(e){
    document.getElementById("hero").innerHTML =
      `<div class="head">couldn't reach the server — retrying…</div>`;
    return;
  }
  document.getElementById("meta").textContent =
    `${d.workspace} · ${d.areas.reduce((n,a)=>n+a.promises,0)} promises · ${d.checks_total} checks`;
  document.getElementById("ledgerLink").href = `/intent/${WS}`;

  const hero = document.getElementById("hero");
  // rise only on the FIRST paint — the 5s poll must re-fill quietly,
  // never re-run the entrance (a page that resettles every poll shouts)
  const risen = hero.dataset.risen ? "" : " rise";
  hero.dataset.risen = "1";
  if(d.all_clear){
    hero.className = "hero ok" + risen;
    hero.innerHTML = `<div class="head">All promises hold.</div>
      <div style="color:var(--dim);font-size:13px">Nothing is contradicting or partially delivering approved intent right now.</div>`;
  }else{
    hero.className = "hero red" + risen;
    const n = d.red_flags.length;
    hero.innerHTML = `<div class="head">${n} promise${n===1?" needs":"s need"} attention</div>` +
      d.red_flags.map(f=>`<div class="flag">
        <span class="${f.health==="CONTRADICTED"?"h-CONTRADICTED":"h-partial"}">${esc(f.health)}</span>
        — <b>${esc(f.statement.slice(0,110))}</b>
        <div class="where">${esc(f.area)} · since check #${f.since_check} · ${esc(f.obligation_id)}</div></div>`).join("");
  }

  document.getElementById("areas").innerHTML = d.areas.map(a=>{
    const r = a.rollup;
    return `<div class="area" onclick="location.href='/intent/${WS}'">
      <div class="label">◉ ${esc(a.label)}</div>
      <div class="counts">
        ${r["satisfied"]?`<span class="dot d-ok"></span>${r["satisfied"]} satisfied<br>`:""}
        ${r["partially delivered"]?`<span class="dot d-warn"></span>${r["partially delivered"]} partially delivered<br>`:""}
        ${r["CONTRADICTED"]?`<span class="dot d-bad"></span>${r["CONTRADICTED"]} CONTRADICTED<br>`:""}
        ${r["no evidence yet"]?`<span class="dot d-none"></span>${r["no evidence yet"]} no evidence yet`:""}
      </div></div>`;
  }).join("");

  const inbox = document.getElementById("inbox");
  const waiting = document.getElementById("waitingHead");
  waiting.querySelectorAll(".needdot").forEach(n=>n.remove());
  if(d.open_findings.length){
    const dot = document.createElement("span"); dot.className = "needdot";
    waiting.appendChild(dot);
  }
  inbox.innerHTML = d.open_findings.length
    ? d.open_findings.map(f=>`<div class="item"><b>check #${f.pr_number}</b> ${esc(f.verdict_display||f.verdict||"")} — ${esc(f.title)}</div>`).join("")
    : `<div class="empty">nothing awaiting a decision</div>`;

  document.getElementById("coverage").textContent = d.coverage_sentence;

  document.getElementById("checks").innerHTML = d.recent_checks.slice().reverse().map(c=>
    `#${c.pr_number} ${esc(c.verdict_display)} — ${esc(c.title.slice(0,64))}`).join("<br>");
}
load();
setInterval(()=>load().catch(()=>{}), 5000);
</script>
</body>
</html>
