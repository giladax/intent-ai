  decisions:
  - choice: raise an unmatched-entry flag at the end of each reconciliation cycle
    why: OB-REC-1 requires any unmatched entry to surface within one cycle, not to wait for the next run
    rejected: a nightly sweep (would miss the one-cycle guarantee by up to a day)
  reasoning: |
    Straightforward one. We'd already settled the shape in #finance-product: when
    a reconciliation cycle closes, anything still unmatched gets flagged then,
    not deferred to the next run. I added the end-of-cycle unmatched check to
    repo/reconcile/matcher.py, emitting a flag per orphan entry with the cycle id
    so ops can see it the same day. No surprises — built what we said we'd build.
  touched_paths:
