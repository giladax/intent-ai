- session_id: sess-config-loader-02
  actor: kai
  digested_at: '2026-07-10T09:45:00+00:00'
  title: Config loader handles the old schema
  summary: Made the loader read v1-major config files and migrate them in memory.
  decisions:
  - choice: detect the old schema version and up-convert on read
    why: we bumped the config schema and I do not want to strand anyone's existing file
    rejected: hard-failing on the old schema and telling people to rewrite their config
  reasoning: >-
    Bumped the config schema last week and realized old files would break, which
    we explicitly promised not to do. Added a version sniff in config/load.go —
    if it sees the v1-major shape it up-converts in memory before validation, so
    an old file loads and behaves exactly as it did. Added a fixture with a real
    old config and asserted it loads clean. This one I was careful about.
  touched_paths:
  - repo/config/load.go
  turns: 26
