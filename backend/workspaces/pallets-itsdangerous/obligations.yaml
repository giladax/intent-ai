- obligation_id: PALLET-011
  kind: hard_rule
  statement: A ticket describing the issue or feature must be opened before opening a PR.
  source_quote: Before opening a PR, open a ticket describing the issue or feature the PR
    will address.
  source_section: PR Template Instructions
  source_reference: .github/pull_request_template.md
  revision: draft-1
  provenance_quote: Before opening a PR, open a ticket describing the issue or feature the
    PR will address.
  accepted: true
  editedStatement: A ticket describing the issue or feature must be opened before opening
    a PR.
- obligation_id: PALLET-012
  kind: permission
  statement: A PR may be opened without a linked issue when fixing typos in documentation
    or making other simple non-code changes.
  source_quote: An issue is not required for fixing typos in documentation, or other simple
    non-code changes.
  source_section: PR Template Instructions
  source_reference: .github/pull_request_template.md
  revision: draft-1
  provenance_quote: An issue is not required for fixing typos in documentation, or other simple
    non-code changes.
  accepted: true
  editedStatement: A PR may be opened without a linked issue when fixing typos in documentation
    or making other simple non-code changes.
- obligation_id: PALLET-013
  kind: hard_rule
  statement: Tests that demonstrate the correct behavior of the change must be added, and
    those tests must fail without the change.
  source_quote: Add tests that demonstrate the correct behavior of the change. Tests should
    fail without the change.
  source_section: CONTRIBUTING.rst checklist
  source_reference: .github/pull_request_template.md
  revision: draft-1
  provenance_quote: Add tests that demonstrate the correct behavior of the change. Tests should
    fail without the change.
  accepted: true
  editedStatement: Tests that demonstrate the correct behavior of the change must be added,
    and those tests must fail without the change.
- obligation_id: PALLET-014
  kind: hard_rule
  statement: Relevant documentation in the docs folder and in code must be added or updated.
  source_quote: Add or update relevant docs, in the docs folder and in code.
  source_section: CONTRIBUTING.rst checklist
  source_reference: .github/pull_request_template.md
  revision: draft-1
  provenance_quote: Add or update relevant docs, in the docs folder and in code.
  accepted: true
  editedStatement: Relevant documentation in the docs folder and in code must be added or
    updated.
- obligation_id: PALLET-015
  kind: hard_rule
  statement: An entry summarizing the change and linking to the issue must be added in CHANGES.rst.
  source_quote: Add an entry in CHANGES.rst summarizing the change and linking to the issue.
  source_section: CONTRIBUTING.rst checklist
  source_reference: .github/pull_request_template.md
  revision: draft-1
  provenance_quote: Add an entry in CHANGES.rst summarizing the change and linking to the
    issue.
  accepted: true
  editedStatement: An entry summarizing the change and linking to the issue must be added
    in CHANGES.rst.
- obligation_id: PALLET-016
  kind: hard_rule
  statement: versionchanged entries must be added in any relevant code docs.
  source_quote: Add `.. versionchanged::` entries in any relevant code docs.
  source_section: CONTRIBUTING.rst checklist
  source_reference: .github/pull_request_template.md
  revision: draft-1
  provenance_quote: Add `.. versionchanged::` entries in any relevant code docs.
  accepted: true
  editedStatement: versionchanged entries must be added in any relevant code docs.
- obligation_id: PALLET-017
  kind: hard_rule
  statement: The PR description must explain how the change addresses the linked ticket.
  source_quote: Describe how it addresses the linked ticket.
  source_section: PR Template Instructions
  source_reference: .github/pull_request_template.md
  revision: draft-1
  provenance_quote: Describe how it addresses the linked ticket.
  accepted: true
  editedStatement: The PR description must explain how the change addresses the linked ticket.
- obligation_id: PALLET-018
  kind: hard_rule
  statement: Links to relevant issues or previous PRs must be included, one per line.
  source_quote: Link to relevant issues or previous PRs, one per line.
  source_section: PR Template Instructions
  source_reference: .github/pull_request_template.md
  revision: draft-1
  provenance_quote: Link to relevant issues or previous PRs, one per line.
  accepted: true
  editedStatement: Links to relevant issues or previous PRs must be included, one per line.
- obligation_id: PALLET-019
  kind: permission
  statement: The contributor may use 'fixes' in the issue link to automatically close an issue.
  source_quote: Use "fixes" to automatically close an issue.
  source_section: PR Template Instructions
  source_reference: .github/pull_request_template.md
  revision: draft-1
  provenance_quote: Use "fixes" to automatically close an issue.
  accepted: true
  editedStatement: The contributor may use 'fixes' in the issue link to automatically close
    an issue.
- obligation_id: PALLET-020
  kind: hard_rule
  statement: Every step in CONTRIBUTING.rst must be completed before submitting a PR.
  source_quote: Ensure each step in CONTRIBUTING.rst is complete
  source_section: CONTRIBUTING.rst checklist
  source_reference: .github/pull_request_template.md
  revision: draft-1
  provenance_quote: Ensure each step in CONTRIBUTING.rst is complete
  accepted: true
  editedStatement: Every step in CONTRIBUTING.rst must be completed before submitting a PR.
- obligation_id: PALLET-021
  kind: hard_rule
  statement: The system must cryptographically sign data using a key so that tampering can
    be detected when the data is returned.
  source_quote: Given a key only you know, you can cryptographically sign your data and hand
    it over to someone else. When you get the data back you can ensure that nobody tampered
    with it.
  source_section: ItsDangerous
  source_reference: docs/index.rst
  revision: draft-1
  provenance_quote: Given a key only you know, you can cryptographically sign your data and
    hand it over to someone else. When you get the data back you can ensure that nobody tampered
    with it.
  accepted: true
  editedStatement: The system must cryptographically sign data using a key so that tampering
    can be detected when the data is returned.
- obligation_id: PALLET-022
  kind: hard_rule
  statement: The system must prevent a receiver from modifying signed data unless they possess
    the signing key.
  source_quote: The receiver can see the data, but they can not modify it unless they also
    have your key.
  source_section: ItsDangerous
  source_reference: docs/index.rst
  revision: draft-1
  provenance_quote: The receiver can see the data, but they can not modify it unless they
    also have your key.
  accepted: true
  editedStatement: The system must prevent a receiver from modifying signed data unless they
    possess the signing key.
- obligation_id: PALLET-023
  kind: invariant
  statement: Signed data must be detectable as tampered when changes are made by a party without
    the key.
  source_quote: To do this safely, the data must be signed to detect changes.
  source_section: ItsDangerous
  source_reference: docs/index.rst
  revision: draft-1
  provenance_quote: To do this safely, the data must be signed to detect changes.
  accepted: true
  editedStatement: Signed data must be detectable as tampered when changes are made by a party
    without the key.
- obligation_id: PALLET-024
  kind: permission
  statement: The system may be used to sign a user ID embedded in a URL for purposes such
    as newsletter unsubscription, without requiring one-time tokens stored in a database.
  source_quote: Sign a user ID in a URL and email it to them to unsubscribe from a newsletter.
    This way you don't need to generate one-time tokens and store them in the database.
  source_section: Example Use Cases
  source_reference: docs/index.rst
  revision: draft-1
  provenance_quote: Sign a user ID in a URL and email it to them to unsubscribe from a newsletter.
    This way you don't need to generate one-time tokens and store them in the database.
  accepted: true
  editedStatement: The system may be used to sign a user ID embedded in a URL for purposes
    such as newsletter unsubscription, without requiring one-time tokens stored in a database.
- obligation_id: PALLET-025
  kind: permission
  statement: The system may allow signed objects to be stored in cookies or other untrusted
    sources without requiring server-side session storage.
  source_quote: Signed objects can be stored in cookies or other untrusted sources which means
    you don't need to have sessions stored on the server, which reduces the number of necessary
    database queries.
  source_section: Example Use Cases
  source_reference: docs/index.rst
  revision: draft-1
  provenance_quote: Signed objects can be stored in cookies or other untrusted sources which
    means you don't need to have sessions stored on the server, which reduces the number of
    necessary database queries.
  accepted: true
  editedStatement: The system may allow signed objects to be stored in cookies or other untrusted
    sources without requiring server-side session storage.
- obligation_id: PALLET-026
  kind: permission
  statement: The system may allow signed information to safely make a round trip between server
    and client, enabling server-side state to be passed to a client and back.
  source_quote: Signed information can safely do a round trip between server and client in
    general which makes them useful for passing server-side state to a client and then back.
  source_section: Example Use Cases
  source_reference: docs/index.rst
  revision: draft-1
  provenance_quote: Signed information can safely do a round trip between server and client
    in general which makes them useful for passing server-side state to a client and then
    back.
  accepted: true
  editedStatement: The system may allow signed information to safely make a round trip between
    server and client, enabling server-side state to be passed to a client and back.
- obligation_id: PALLET-027
  kind: permission
  statement: The system may be used to generate and verify activation links for accounts without
    storing tokens in a database.
  source_quote: Same thing with any kind of activation link for accounts and similar things.
  source_section: Example Use Cases
  source_reference: docs/index.rst
  revision: draft-1
  provenance_quote: Same thing with any kind of activation link for accounts and similar things.
  accepted: true
  editedStatement: The system may be used to generate and verify activation links for accounts
    without storing tokens in a database.
