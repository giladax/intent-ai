# Where each promise lives in code: control_points are the code
# locations; bindings type the relation (decides/enforces/executes/
# configures/observes/verifies) between a promise and a location.
control_points:
- control_point_id: CP-pydantic-core-tests-validators-test-bool-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_bool.py
  description: Test file for bool validator covers strict mode rejection of non-boolean types
    (integers, strings, bytes).
- control_point_id: CP-pydantic-core-tests-test-strict-py
  role: test_or_eval
  path: pydantic-core/tests/test_strict.py
  description: Dedicated strict-mode test file verifies that strict mode enforces type constraints
    including bool fields.
- control_point_id: CP-pydantic-internal-generate-schema-py
  role: decision
  path: pydantic/_internal/_generate_schema.py
  description: Generates the pydantic-core bool schema with strict mode configuration, determining
    which validator is applied.
- control_point_id: CP-pydantic-core-tests-validators-test-string-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_string.py
  description: Test file for string validator covers strict mode rejection of bytes, bytearray,
    enums, and numbers for str fields.
- control_point_id: CP-pydantic-core-tests-validators-test-bytes-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_bytes.py
  description: Test file for bytes validator covers strict mode rejection of strings and bytearray,
    and JSON mode behavior.
- control_point_id: CP-pydantic-core-tests-validators-test-int-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_int.py
  description: Test file for int validator covers float-to-int coercion rules including rejection
    of inf, NaN, and non-zero fractional parts.
- control_point_id: CP-pydantic-core-tests-validators-test-float-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_float.py
  description: Test file for float validator exercises float validity constraints relevant
    to integer coercion.
- control_point_id: CP-pydantic-internal-validators-py
  role: enforcement
  path: pydantic/_internal/_validators.py
  description: Contains Python-side validators that may enforce float-to-int coercion constraints
    (inf, NaN, fractional part checks).
- control_point_id: CP-pydantic-core-tests-validators-test-datetime-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_datetime.py
  symbol: test_datetime_strict
  description: 'Directly tests strict mode for datetime: only datetime instances accepted
    in Python mode, RFC 3339 strings/unix timestamps in JSON mode.'
- control_point_id: CP-pydantic-core-tests-validators-test-list-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_list.py
  description: Tests list/sequence validation including rejection of strings and bytes as
    sequence inputs.
- control_point_id: CP-pydantic-core-tests-serializers-test-functions-py
  role: test_or_eval
  path: pydantic-core/tests/serializers/test_functions.py
  description: Tests serialization of callables, verifying that PydanticSerializationError
    is raised in JSON mode.
- control_point_id: CP-pydantic-core-tests-serializers-test-other-py
  role: test_or_eval
  path: pydantic-core/tests/serializers/test_other.py
  description: Tests serialization of miscellaneous types including callables in JSON mode.
- control_point_id: CP-pydantic-core-tests-serializers-test-decimal-py
  role: test_or_eval
  path: pydantic-core/tests/serializers/test_decimal.py
  description: Tests that Decimal instances are serialized as strings in JSON mode.
- control_point_id: CP-pydantic-core-tests-validators-test-decimal-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_decimal.py
  description: 'Tests strict mode for Decimal: only decimal.Decimal instances accepted in
    Python strict mode; JSON mode unaffected.'
- control_point_id: CP-pydantic-core-tests-validators-test-tuple-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_tuple.py
  description: Tests tuple validation in strict mode, confirming inner items are not subject
    to strict mode constraints.
- control_point_id: CP-pydantic-core-tests-validators-test-dict-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_dict.py
  description: Tests dict validation in strict mode, confirming inner key/value types are
    not subject to strict mode constraints.
- control_point_id: CP-pydantic-core-tests-validators-test-set-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_set.py
  description: Tests set validation in strict mode, confirming inner items are not subject
    to strict mode constraints.
- control_point_id: CP-pydantic-core-tests-validators-test-callable-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_callable.py
  description: Tests that callable validation only checks callability, not parameter count,
    types, or return type.
- control_point_id: CP-pydantic-core-tests-validators-test-generator-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_generator.py
  description: Tests that Iterable/generator items are validated lazily at iteration time,
    not eagerly at input time.
- control_point_id: CP-pydantic-config-py
  role: configuration
  path: pydantic/config.py
  symbol: ConfigDict
  description: Defines the coerce_numbers_to_str configuration option that enables number-to-string
    coercion.
- control_point_id: CP-pydantic-internal-config-py
  role: enforcement
  path: pydantic/_internal/_config.py
  description: Processes and propagates the coerce_numbers_to_str config setting into the
    core schema configuration.
- control_point_id: CP-pydantic-core-tests-test-config-py
  role: test_or_eval
  path: pydantic-core/tests/test_config.py
  description: Tests configuration options including coerce_numbers_to_str behavior.
- control_point_id: CP-pydantic-internal-serializers-py
  role: enforcement
  path: pydantic/_internal/_serializers.py
  description: Contains serializer logic for special types; Fraction serialization as string
    in both Python and JSON modes would be configured here.
- control_point_id: CP-pydantic-core-tests-serializers-test-simple-py
  role: test_or_eval
  path: pydantic-core/tests/serializers/test_simple.py
  description: Tests serialization of simple/primitive types which may include Fraction serialization
    as string.
- control_point_id: CP-pydantic-core-tests-serializers-test-any-py
  role: test_or_eval
  path: pydantic-core/tests/serializers/test_any.py
  description: Tests serialization of arbitrary/unsupported types and verifies PydanticSerializationError
    is raised when a value cannot be serialized to JSON.
- control_point_id: CP-pydantic-core-python-pydantic-core-init-py
  role: configuration
  path: pydantic-core/python/pydantic_core/__init__.py
  symbol: PydanticSerializationError
  description: Exports PydanticSerializationError as part of the public API, making it the
    designated exception type for serialization failures.
- control_point_id: CP-pydantic-core-tests-serializers-test-model-py
  role: test_or_eval
  path: pydantic-core/tests/serializers/test_model.py
  description: Imports and uses PydanticSerializationError to verify it is raised when unsupported
    types are encountered during serialization.
- control_point_id: CP-pydantic-internal-decorators-py
  role: enforcement
  path: pydantic/_internal/_decorators.py
  description: Processes @field_serializer and @model_serializer decorators and enforces that
    only one serializer may be defined per field or model, raising errors on conflicts.
- control_point_id: CP-pydantic-core-tests-serializers-test-serialize-as-any-py
  role: test_or_eval
  path: pydantic-core/tests/serializers/test_serialize_as_any.py
  description: Directly tests the serialize_as_any / polymorphic serialization behavior, verifying
    the default is to serialize only annotation-type fields.
- control_point_id: CP-pydantic-core-python-pydantic-core-core-schema-py
  role: configuration
  path: pydantic-core/python/pydantic_core/core_schema.py
  description: Defines schema building functions (e.g. is_instance_schema, union_schema) that
    encode the rule that subclasses are serialized via their superclass schema.
- control_point_id: CP-pydantic-functional-serializers-py
  role: enforcement
  path: pydantic/functional_serializers.py
  symbol: field_serializer
  description: Implements the @field_serializer decorator that enforces plain mode serializers
    are invoked unconditionally.
- control_point_id: CP-pydantic-main-py
  role: enforcement
  path: pydantic/main.py
  symbol: __iter__
  description: Implements __iter__ on BaseModel to yield field values as-is without converting
    sub-models to dicts.
- control_point_id: CP-pydantic-core-tests-serializers-test-typed-dict-py
  role: test_or_eval
  path: pydantic-core/tests/serializers/test_typed_dict.py
  symbol: test_include_exclude_schema
  description: Tests that serialization_exclude at the field level overrides include arguments
    passed at runtime.
- control_point_id: CP-pydantic-core-tests-serializers-test-dataclasses-py
  role: test_or_eval
  path: pydantic-core/tests/serializers/test_dataclasses.py
  symbol: test_serialization_exclude
  description: Tests that field-level serialization_exclude takes priority over runtime include
    parameters.
- control_point_id: CP-pydantic-internal-dataclasses-py
  role: enforcement
  path: pydantic/_internal/_dataclasses.py
  description: Handles Pydantic dataclass schema generation and enforces that polymorphic
    serialization is only available for Pydantic models and Pydantic dataclasses, not stdlib
    dataclasses.
- control_point_id: CP-pydantic-type-adapter-py
  role: executor
  path: pydantic/type_adapter.py
  symbol: dump_python
  description: Implements dump_python on TypeAdapter which accepts the serialize_as_any flag
    enabling runtime polymorphic serialization.
- control_point_id: CP-pydantic-core-tests-validators-test-union-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_union.py
  description: Test file for union validators covers left-to-right validation order behavior
    in pydantic-core.
- control_point_id: CP-docs-concepts-unions-md
  role: configuration
  path: docs/concepts/unions.md
  description: Documents the left-to-right union validation mode and its behavior for users.
- control_point_id: CP-pydantic-fields-py
  role: enforcement
  path: pydantic/fields.py
  symbol: Field
  description: Defines the Field function that accepts union_mode parameter to configure left-to-right
    mode.
- control_point_id: CP-pydantic-internal-discriminated-union-py
  role: enforcement
  path: pydantic/_internal/_discriminated_union.py
  description: Handles callable discriminator logic and raises union_tag_not_found when discriminator
    returns None.
- control_point_id: CP-pydantic-core-tests-validators-test-tagged-union-py
  role: test_or_eval
  path: pydantic-core/tests/validators/test_tagged_union.py
  description: Tests that union_tag_not_found error is raised when a callable discriminator
    returns None.
- control_point_id: CP-docs-errors-validation-errors-md
  role: audit
  path: docs/errors/validation_errors.md
  description: Documents the union_tag_not_found validation error type and when it is raised.
- control_point_id: CP-pydantic-json-schema-py
  role: executor
  path: pydantic/json_schema.py
  description: Generates JSON schema for discriminated unions including the OpenAPI discriminator
    attribute.
- control_point_id: CP-pydantic-types-py
  role: configuration
  path: pydantic/types.py
  symbol: Discriminator
  description: Defines the Discriminator class that accepts custom_error_type, custom_error_message,
    and custom_error_context parameters.
- control_point_id: CP-pydantic-internal-known-annotated-metadata-py
  role: enforcement
  path: pydantic/_internal/_known_annotated_metadata.py
  description: Processes annotated metadata including union_mode from Field annotations to
    configure union validation.
- control_point_id: CP-docs-version-policy-md
  role: audit
  path: docs/version-policy.md
  description: Documents the version policy under which internal algorithm changes (like smart
    mode) may occur in minor releases.
- control_point_id: CP-tests-benchmarks-test-discriminated-unions-py
  role: test_or_eval
  path: tests/benchmarks/test_discriminated_unions.py
  description: Benchmark tests for discriminated unions that exercise union validation paths
    including left-to-right.
