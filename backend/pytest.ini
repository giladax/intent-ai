[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    requires_postgres: mark test as requiring a live Postgres connection (skipped when DB is unreachable)
filterwarnings =
    # digest_session warns when the link store is unreachable/guarded in tests —
    # expected, not a bug. Match on message: stacklevel=2 attributes the warning
    # to the calling module, so a module filter on quire.session never matches.
    ignore:.*link store write failed.*:RuntimeWarning
