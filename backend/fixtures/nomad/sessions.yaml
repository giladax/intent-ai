  decisions:
  - choice: wrap the read error with the file path and a one-line hint
    why: a corrupt file dumped a raw error and people could not tell which file
    rejected: leaving the raw error through
  reasoning: >-
    Hit a garbled file locally and the error was a wall of Go internals with no
    path. Wrapped the read failure in config/load.go with the offending path and
    a short hint. Still fails loud and non-zero, just readable now. No behavior
