# --- #leadership: the CTO mandate (names Ledger → ties to ent-ledger) -------
- id: m11
  channel: '#leadership'
  actor: cto
  ts: '2026-06-04T08:15:00+00:00'
  kind: decision
  text: 'mandate: Ledger correctness is existential and comes before every
    throughput target. Every change to the postings path ships with a
    sum-to-zero assertion at commit — if debits and credits don''t net to zero,
    it does not merge. A single unbalanced posting is a regulatory event. I''ll
    back correctness over speed every time.'

